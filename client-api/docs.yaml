info:
  title: Get-App
  description: The Get-App API swagger
  version: 0.5.4
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserLoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    TokensDto:
      type: object
      properties:
        accessToken:
          type: string
        expireAt:
          format: date-time
          type: string
        refreshToken:
          type: string
        refreshExpireAt:
          format: date-time
          type: string
      required:
        - accessToken
        - refreshToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
    UploadArtifactDto:
      type: object
      properties:
        platform:
          type: string
        component:
          type: string
        formation:
          type: string
        OS:
          type: string
        version:
          type: string
        releaseNotes:
          type: string
        size:
          type: string
        url:
          type: string
        artifactType:
          type: string
        uploadToken:
          type: string
    UploadManifestDto:
      type: object
      properties:
        file:
          type: string
          format: binary
        uploadToken:
          type: string
      required:
        - file
    UpdateUploadStatusDto:
      type: object
      properties:
        catalogId:
          type: string
        status:
          type: string
          enum:
            - started
            - downloading-from-url
            - fail-to-download
            - uploading-to-s3
            - fail-to-upload
            - in-progress
            - ready
            - error
        uploadToken:
          type: string
      required:
        - status
    ComponentDto:
      type: object
      properties:
        catalogId:
          type: string
        name:
          type: string
        versionNumber:
          type: string
        releaseNotes:
          type: string
        virtualSize:
          type: number
        category:
          type: string
        baseVersion:
          type: string
        prevVersion:
          type: string
        latest:
          type: boolean
        uploadDate:
          format: date-time
          type: string
        subComponents:
          type: array
          items:
            $ref: '#/components/schemas/ComponentDto'
    SetReleaseDto:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          type: object
        isDraft:
          type: boolean
          default: true
        dependencies:
          description: >-
            List of dependencies. Providing an empty array will remove all
            dependencies. Omitting this field or setting it to null will leave
            dependencies unchanged.
          type: array
          items:
            type: string
      required:
        - version
    ReleaseArtifactDto:
      type: object
      properties:
        id:
          type: number
        artifactName:
          type: string
        type:
          type: string
          enum:
            - file
            - docker_image
        metadata:
          type: object
        isInstallationFile:
          type: boolean
        dockerImageUrl:
          type: string
        uploadId:
          type: number
        status:
          type: string
          enum:
            - uploaded
            - pending
            - removed
        size:
          type: integer
          format: int64
      required:
        - id
        - artifactName
        - type
        - metadata
        - isInstallationFile
        - uploadId
    ReleaseDto:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        projectName:
          type: string
        projectId:
          type: number
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: &ref_22
            - draft
            - in_review
            - approved
            - released
            - archived
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        requiredRegulationsCount:
          type: number
          description: Total number of required regulations
        compliantRegulationsCount:
          type: number
          description: Total number of compliant regulations
        latest:
          type: boolean
        releasedAt:
          format: date-time
          type: string
      required:
        - id
        - version
        - projectName
        - name
        - releaseNotes
        - metadata
        - status
        - createdAt
        - updatedAt
        - requiredRegulationsCount
        - compliantRegulationsCount
        - latest
    DetailedReleaseDto:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        projectName:
          type: string
        projectId:
          type: number
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: *ref_22
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        requiredRegulationsCount:
          type: number
          description: Total number of required regulations
        compliantRegulationsCount:
          type: number
          description: Total number of compliant regulations
        latest:
          type: boolean
        releasedAt:
          format: date-time
          type: string
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseArtifactDto'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDto'
      required:
        - id
        - version
        - projectName
        - name
        - releaseNotes
        - metadata
        - status
        - createdAt
        - updatedAt
        - requiredRegulationsCount
        - compliantRegulationsCount
        - latest
    SetReleaseArtifactDto:
      type: object
      properties:
        artifactName:
          type: string
        type:
          type: string
          enum:
            - file
            - docker_image
          default: file
        isInstallationFile:
          type: boolean
        dockerImageUrl:
          type: string
        metadata:
          type: object
      required:
        - artifactName
    SetReleaseArtifactResDto:
      type: object
      properties:
        artifactId:
          type: number
        uploadUrl:
          type: string
          description: Only present for FILE artifact type
      required:
        - artifactId
    RegulationSnapshotDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the regulation
        description:
          type: string
          description: Description of the regulation
        config:
          type: string
          description: Configuration of the regulation
        typeId:
          type: number
          description: Type Id of the regulation
      required:
        - name
        - typeId
    RegulationStatusDto:
      type: object
      properties:
        projectIdentifier:
          type: string
          description: Project identifier (ID or name)
        version:
          type: string
          description: Component Version of the regulation
        regulation:
          type: string
          description: Name of the regulation
        value:
          type: string
          description: Value of the regulation
        reportDetails:
          type: string
          description: Report Details of the regulation
        isCompliant:
          type: boolean
          description: Compliancy of the regulation
        createdAt:
          format: date-time
          type: string
          description: Creation date of the regulation status
        updatedAt:
          format: date-time
          type: string
          description: Update date of the regulation status
        regulationSnapshot:
          $ref: '#/components/schemas/RegulationSnapshotDto'
      required:
        - projectIdentifier
        - version
        - regulation
        - value
        - isCompliant
        - createdAt
        - updatedAt
    SetRegulationStatusDto:
      type: object
      properties:
        value:
          type: string
          description: Value of the regulation
        reportDetails:
          type: string
          description: Report Details of the regulation
      required:
        - value
    SetRegulationCompliancyDto:
      type: object
      properties:
        isCompliant:
          type: boolean
          description: Compliancy of the regulation
      required:
        - isCompliant
    ComponentV2Dto:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
