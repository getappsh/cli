    ErrorDto:
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - APP.unknown
            - DELIVERY.unknown
            - DELIVERY.notFound
            - DELIVERY.download
            - DELIVERY.downloadNotAvailable
            - DELIVERY.notExist
            - DELIVERY.invalid
            - DELIVERY.notVerified
            - DELIVERY.packageTooLarge
            - DELIVERY.unableClearCache
            - PROJECT_MANAGEMENT.unknown
            - PROJECT_MANAGEMENT.deleteProjectFailed
            - PROJECT_MANAGEMENT.webhookInvalid
            - PROJECT_MANAGEMENT.labelNotFound
            - PROJECT_MANAGEMENT.labelAlreadyExists
            - PROJECT_MANAGEMENT.labelInUse
            - MAP.unknown
            - MAP.notFound
            - MAP.bBoxIsInvalid
            - MAP.bBoxNotInAnyPolygon
            - MAP.getRecordsFailed
            - MAP.exportMapFailed
            - MAP.requestInProgress
            - MAP.areaTooLarge
            - MAP.areaTooSmall
            - DEVICE.notFound
            - DEVICE.hasChildren
            - DEVICE_TYPE.notFound
            - DEVICE_TYPE.alreadyExists
            - DEVICE_PLATFORM.notFound
            - DEVICE_PLATFORM.alreadyExists
            - GROUP.notFound
            - GROUP.notAllowedToAdd
            - GROUP.orgIdUnknown
            - GROUP.orgIdNotAllowed
            - GROUP.orgIdConflict
            - GROUP.orgIdNotFound
            - RULE.validationFailed
            - RULE.fieldNotSupported
            - RULE.fieldAlreadyExists
            - RULE.fieldNotFound
            - RELEASE.hasDependents
          description: >-
            `APP.unknown`: General Error code not listed in the enum <br />
            `DELIVERY.unknown`: Error code not listed in the enum <br />
            `DELIVERY.notFound`: No found the delivery with given catalog id <br
            /> `DELIVERY.download`: Download of delivery item failed <br />
            `DELIVERY.downloadNotAvailable`: Delivery item not yet available for
            download <br /> `DELIVERY.notExist`: The Package not exist in
            storage <br /> `DELIVERY.invalid`: Package of given catalog id is
            invalid, maybe expired or some else <br /> `DELIVERY.notVerified`:
            Package of given catalog id is not verified, the package can be in
            valid <br /> `DELIVERY.packageTooLarge`:  Package of given catalog
            id is too large, no space in cache<br />
            `DELIVERY.unableClearCache`:  Some issue occurs when trying to clear
            cache <br /> `PROJECT_MANAGEMENT.unknown`: Error code not listed in
            the enum <br /> `PROJECT_MANAGEMENT.deleteProjectFailed`: Failed to
            delete the project <br /> `PROJECT_MANAGEMENT.webhookInvalid`:
            Webhook token is invalid or no matching project found <br />
            `PROJECT_MANAGEMENT.labelNotFound`: Label with the given id or name
            was not found <br /> `PROJECT_MANAGEMENT.labelAlreadyExists`: Label
            with the given name already exists <br />
            `PROJECT_MANAGEMENT.labelInUse`: Label cannot be deleted as it is
            being used by projects <br /> `MAP.unknown`: Error code not listed
            in the enum <br /> `MAP.notFound`: No found the map with given id
            <br /> `MAP.bBoxIsInvalid`: BBox is probably invalid <br />
            `MAP.bBoxNotInAnyPolygon`: The given BBox in not contains in any
            polygon <br /> `MAP.getRecordsFailed`: Failed to get
            records.<br/>`MAP.exportMapFailed`: Some error occurs when import
            map <br /> `MAP.requestInProgress`: Delivery was already requested
            and in processing! <br /> `MAP.areaTooLarge`: Area too large to
            distribute, reduce request size and try again <br />
            `MAP.areaTooSmall`: Area too small to distribute, increase request
            size and try again . `DEVICE.notFound`: Device with given id not
            found.<br/>`DEVICE.hasChildren`: Device has child devices and cannot
            be deleted.<br/>`DEVICE.hasChildren`: Cannot delete device because
            it has child devices.<br/>`DEVICE_DT_NOT_FOUND`: Device type with
            given id not found.<br/>`DEVICE_DT_ALREADY_EXISTS`: Device type with
            given name already exists.<br/>`DEVICE_PLATFORM.notFound`: Platform
            with given id or name not
            found.<br/>`DEVICE_PLATFORM_ALREADY_EXISTS`: Platform with given
            name already exists.<br/>`GROUP_NOT_FOUND`: Group with the given id
            was not found.<br/>`GROUP_NOT_ALLOWED_TO_ADD`: Not allowed to add to
            the group, see message for cause.<br/>`GROUP.orgIdUnknown`:
            Organization ID is unknown, see message for
            cause.<br/>`GROUP.orgIdNotAllowed`: Organization ID is not allowed
            to be used, see message for cause.<br/>`GROUP.orgIdConflict`:
            Organization ID conflict occurred.<br/>`GROUP.orgIdNotFound`:
            Organization ID not found.<br/>`RULE.validationFailed`: Rule
            validation against rule engine failed.<br/>`RULE.fieldNotSupported`:
            One or more fields in the rule are not
            supported.<br/>`RULE.fieldAlreadyExists`: Rule field with the given
            name already exists.<br/>`RULE.fieldNotFound`: Rule field with the
            given name was not found.<br/>`RELEASE.hasDependents`: Cannot delete
            release because other releases depend on it.
        message:
          type: string
