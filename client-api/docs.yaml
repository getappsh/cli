          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMapDto'
      tags: *ref_17
      security: *ref_18
  /api/v1/device/{deviceId}/softwares:
    get:
      operationId: DeviceController_getDeviceSoftwares
      summary: Get Device softwares
      description: >-
        This service message allows retrieval of all software on a process in a
        given device.
      parameters:
        - name: deviceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSoftwareDto'
      tags: *ref_17
      security: *ref_18
  /api/v1/device/info/installed/{deviceId}:
    get:
      operationId: DeviceController_getDeviceContentInstalled
      summary: Get Installed Device Content
      description: >-
        This service message allows receiving information about the
        installations carried out on the device using GetApp services. This
        message is sent by the device during the initialization phase to check
        compatibility between the existing installations on this device.
      parameters:
        - name: deviceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceContentResDto'
      tags: *ref_17
      security: *ref_18
  /api/v1/bug-report:
    post:
      operationId: BugReportController_reportNewBug
      summary: Report New Bug
      description: >-
        This endpoint allows a user to report a new bug associated with a
        specific device.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBugReportDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewBugReportResDto'
      tags: &ref_19
        - Device - Bug Report
      security: &ref_20
        - bearer: []
  /api/v1/bug-report/{bugId}:
    get:
      operationId: BugReportController_getBugReport
      summary: Get Bug Report
      description: >-
        This endpoint allows a user to fetch the details of a bug report using
        its unique identifier.
      parameters:
        - name: bugId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReportDto'
      tags: *ref_19
      security: *ref_20
