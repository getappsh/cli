        - Device - Hierarchy
      parameters:
        - name: deviceTypeId
          required: true
          in: path
          description: ID of the device type
          schema:
            type: number
        - name: projectIdentifier
          required: true
          in: path
          description: Project identifier (ID or name)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypeHierarchyDto'
      security: *ref_32
    delete:
      operationId: HierarchyController_removeProjectFromDeviceType
      summary: Remove Project from Device Type
      tags:
        - Device - Hierarchy
      parameters:
        - name: deviceTypeId
          required: true
          in: path
          description: ID of the device type
          schema:
            type: number
        - name: projectIdentifier
          required: true
          in: path
          description: Project identifier (ID or name)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypeHierarchyDto'
      security: *ref_32
  /api/v1/catalog/pendingVersions:
    get:
      operationId: PendingVersionController_listPendingVersions
      summary: List all pending versions
      description: >-
        Returns a list of project versions that were reported by devices but do
        not exist in the system
      parameters:
        - name: limit
          required: false
          in: query
          description: 'Number of results to return (default: 100)'
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: 'Offset for pagination (default: 0)'
          schema:
            type: number
        - name: status
          required: false
          in: query
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
            type: string
      responses:
        '200':
          description: List of pending versions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVersionListDto'
      tags: &ref_33
        - Catalog - Pending
      security: &ref_34
        - bearer: []
  /api/v1/catalog/pendingVersions/accept:
    post:
      operationId: PendingVersionController_acceptPendingVersion
      summary: Accept a pending version
      description: >-
        Accepts a pending version and creates the project/version in the system.
        If the project does not exist, it will be created.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptPendingVersionDto'
      responses:
        '200':
          description: Version accepted successfully and will be created
        '400':
          description: Invalid request or version already processed
      tags: *ref_33
      security: *ref_34
  /api/v1/catalog/pendingVersions/reject:
    post:
      operationId: PendingVersionController_rejectPendingVersion
      summary: Reject a pending version
      description: >-
        Rejects a pending version. The version will be marked as rejected and
        will not be processed.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPendingVersionDto'
      responses:
        '200':
          description: Version rejected successfully
        '400':
          description: Invalid request or version already processed
      tags: *ref_33
      security: *ref_34
  /api/v1/rules:
    get:
      operationId: RulesController_getAllRules
      summary: Get all rules
      description: >-
        Fetches all rules (both policies and restrictions) from upload and
        discovery services. Supports filtering by type to query only policies or
        restrictions.
      parameters:
        - name: type
          required: false
          in: query
          description: Filter by rule type (policy or restriction)
          schema:
            enum:
              - policy
              - restriction
            type: string
        - name: isActive
          required: false
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: releaseId
          required: false
          in: query
          description: Filter by release ID (policies only)
          schema:
            type: string
        - name: deviceTypeName
          required: false
          in: query
          description: Filter by device type name (restrictions only)
          schema:
            type: string
        - name: deviceTypeId
          required: false
          in: query
          description: Filter by device type ID (restrictions only)
          schema:
            type: number
        - name: deviceId
          required: false
          in: query
          description: Filter by device ID (restrictions only)
          schema:
            type: string
        - name: osType
          required: false
          in: query
          description: Filter by OS type (restrictions only)
          schema:
            type: string
      responses:
        '200':
          description: List of all rules
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags: &ref_35
        - Rules
      security: &ref_36
        - bearer: []
  /api/v1/rules/evaluate:
    post:
      operationId: RulesController_evaluateRule
      summary: Evaluate a rule against all devices
      description: >-
        Tests a rule against every device using its latest discovery data.
        Supply either a saved ruleId or an inline rule JSON. For saved policy
        rules the response additionally contains the releases the policy is
        attached to.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRuleDto'
      responses:
        '200':
          description: Devices matching the rule, plus release context for policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateRuleResultDto'
      tags: *ref_35
      security: *ref_36
  /api/v1/rules/device-context:
    get:
      operationId: RulesController_getDeviceContext
      summary: Get device evaluation context
      description: >-
        Returns the evaluation context built from the latest discovery message
        for a device. Supply either deviceId (returns the latest message for
        that device) or discoveryMessageId (returns the context for that exact
        message, deviceId not required). The context structure is identical to
        what is used internally during rule evaluation.
      parameters:
        - name: deviceId
          required: false
          in: query
          description: >-
            Device ID to look up. Required when discoveryMessageId is not
            provided.
          schema:
            type: string
        - name: discoveryMessageId
          required: false
          in: query
          description: >-
            ID of a specific discovery message to use. When provided, deviceId
            is not required.
          schema:
            type: string
      responses:
        '200':
          description: Device context and the discovery message it was built from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceContextDto'
      tags: *ref_35
      security: *ref_36
  /api/v1/sbom/scans:
    post:
      operationId: SbomController_requestScan
      summary: Queue a new SBOM scan for a docker image, binary file, or directory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanPayload'
      responses:
        '201':
          description: Scan queued successfully, returns scanId
      tags: &ref_37
        - SBOM
      security: &ref_38
        - bearer: []
    get:
      operationId: SbomController_listScans
      summary: List recent SBOM scan jobs
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: number
        - name: offset
          required: false
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Array of scan status objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanStatusResponseDto'
      tags: *ref_37
      security: *ref_38
  /api/v1/sbom/scans/{id}:
    get:
      operationId: SbomController_getScanStatus
      summary: Get scan status and metadata by ID
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: Scan status and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatusResponseDto'
        '404':
          description: Scan not found
      tags: *ref_37
      security: *ref_38
    delete:
      operationId: SbomController_deleteScan
      summary: Delete a scan by ID. Cancels it if still queued.
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_37
      security: *ref_38
  /api/v1/sbom/scans/{id}/report:
    get:
      operationId: SbomController_getScanReportUrl
      summary: Get presigned download URL for a completed SBOM report
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_37
      security: *ref_38
  /api/v1/sbom/scans/{id}/retry:
    post:
      operationId: SbomController_retryScan
      summary: Retry a failed or completed SBOM scan
      description: >-
        Re-queues the scan under the same ID. For file-based scans that
        originated from a MinIO upload, a fresh presigned download URL is
        automatically regenerated from the stored source object key so expired
        links are never reused.
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID to retry
          schema:
            type: string
      responses:
        '201':
          description: Scan re-queued successfully, returns scanId and status
        '404':
          description: Scan not found
        '409':
          description: Scan is already queued or running
      tags: *ref_37
      security: *ref_38
info:
  title: Get-App
  description: The Get-App API swagger
  version: 0.5.4
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserLoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    TokensDto:
      type: object
      properties:
        accessToken:
          type: string
        expireAt:
          format: date-time
          type: string
        refreshToken:
          type: string
        refreshExpireAt:
          format: date-time
          type: string
      required:
        - accessToken
        - refreshToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
    ReleaseIdentifierDto:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID
        projectName:
          type: string
          description: Project name
        version:
          type: string
          description: Release version
      required:
        - projectName
        - version
    PolicyAssociationDto:
      type: object
      properties:
        releases:
          description: Releases for this policy
          type: array
          items:
            $ref: '#/components/schemas/ReleaseIdentifierDto'
      required:
        - releases
    CreatePolicyDto:
      type: object
      properties:
        name:
          type: string
          description: Policy name
        description:
          type: string
          description: Policy description
        association:
          description: Policy associations
          allOf:
            - $ref: '#/components/schemas/PolicyAssociationDto'
        isActive:
          type: boolean
          description: Whether the policy is active
          default: true
        isPush:
          type: boolean
          description: Whether this policy should be pushed to agents
          default: false
        rule:
          type: object
          description: Rule engine compliant rule object
      required:
        - name
        - association
        - rule
    RuleAssociationDto:
      type: object
      properties:
        releases:
          description: Releases for policies
          type: array
          items:
            $ref: '#/components/schemas/ReleaseIdentifierDto'
        deviceTypeNames:
          description: Device type names for restrictions
          type: array
          items:
            type: string
        osTypes:
          description: OS types for restrictions
          type: array
          items:
            type: string
        deviceIds:
          description: Specific device IDs for restrictions
          type: array
          items:
            type: string
    UpdateRuleDto:
      type: object
      properties:
        name:
          type: string
          description: Rule name
        description:
          type: string
          description: Rule description
        type:
          type: string
          enum:
            - policy
            - restriction
          description: Rule type (policy or restriction)
        association:
          description: Rule associations
          allOf:
            - $ref: '#/components/schemas/RuleAssociationDto'
        isActive:
          type: boolean
          description: Whether the rule is active
          default: true
        isPush:
          type: boolean
          description: Whether this policy should be pushed to agents
          default: false
        rule:
          type: object
          description: Rule engine compliant rule object
    CreateRuleFieldDto:
      type: object
      properties:
        name:
          type: string
          description: Field name in JSONPath format (e.g., $.battery.level)
        type:
          type: string
          description: Field data type
        label:
          type: string
          description: Human-readable label
        description:
          type: string
          description: Field description
      required:
        - name
        - type
        - label
    PostInstallAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - NONE
            - WEB
            - EXE
          description: >-
            Action type: NONE (no action), WEB (open URL), or EXE (run
            executable)
        url:
          type: string
          description: URL to open (required when type is WEB)
        exePath:
          type: string
          description: Executable path to run (required when type is EXE)
      required:
        - type
    ReleaseMetadata:
      type: object
      properties:
        autoDeploy:
          type: boolean
          description: Enable automatic deployment of this release
        postInstallAction:
          description: Post-installation action configuration
          allOf:
            - $ref: '#/components/schemas/PostInstallAction'
        installationSize:
          type: integer
          format: int64
          description: >-
            Installation size in bytes - disk space required after installation
            (user-specified)
        totalSize:
          type: integer
          format: int64
          description: >-
            Total size in bytes - automatically calculated as installationSize +
            artifactsSize
    SetReleaseDto:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          description: >-
            Release metadata including autoDeploy and postInstallAction
            configuration. Additional user-defined properties are supported.
          allOf:
            - $ref: '#/components/schemas/ReleaseMetadata'
        isDraft:
          type: boolean
          default: true
        dependencies:
          description: >-
            List of dependencies. Providing an empty array will remove all
            dependencies. Omitting this field or setting it to null will leave
            dependencies unchanged.
          type: array
          items:
            type: string
      required:
        - version
    ReleaseArtifactDto:
      type: object
      properties:
        id:
          type: number
        artifactName:
          type: string
        type:
          type: string
          enum:
            - file
            - docker_image
        metadata:
          type: object
        isInstallationFile:
          type: boolean
        dockerImageUrl:
          type: string
        isExecutable:
          type: boolean
          default: false
        arguments:
          type: object
        uploadId:
          type: number
        status:
          type: string
          enum:
            - uploaded
            - pending
            - uploading
            - removed
            - error
        size:
          type: integer
          format: int64
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Upload/download progress percentage (0-100). Check status field for
            errors.
        error:
          type: string
          description: Error message when status indicates an error
        sha256:
          type: string
          description: SHA256 hash of the file
        enableSbomScan:
          type: boolean
          default: true
          description: Whether SBOM scan is enabled for this artifact
        sbomScanId:
          type: string
          description: SBOM scan ID associated with this artifact
      required:
        - id
        - artifactName
        - type
        - metadata
        - isInstallationFile
        - uploadId
    ReleaseDto:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        projectName:
          type: string
        projectId:
          type: number
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          description: >-
            Release metadata including autoDeploy and postInstallAction
            configuration. Additional user-defined properties are supported.
          allOf:
            - $ref: '#/components/schemas/ReleaseMetadata'
        status:
          type: string
          enum: &ref_39
            - draft
            - in_review
            - approved
            - released
            - archived
            - error
          description: >-
            `draft`: Release is still being prepared.

            `in_review`: Submitted for review, not yet approved.

            `approved`: Approved but not yet released.

            `released`: Actively released and deployable.

            `archived`: No longer active.

            `error`: Release was previously released but one or more artifacts
            are missing from storage. Requires a user with
            `edit-released-release` permission to resolve.
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        requiredRegulationsCount:
          type: number
          description: Total number of required regulations
        compliantRegulationsCount:
          type: number
          description: Total number of compliant regulations
        latest:
          type: boolean
        releasedAt:
          format: date-time
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        isImported:
          type: boolean
          description: Indicates if this release was imported from another system
        readonly:
          type: boolean
          description: >-
            Indicates if this release is read-only. A release is read-only when
            its status is `released` or `error` and the current user does not
            have the `edit-released-release` permission.
      required:
        - id
        - version
        - projectName
        - name
        - releaseNotes
        - metadata
        - status
        - createdAt
        - updatedAt
        - requiredRegulationsCount
        - compliantRegulationsCount
        - latest
        - isImported
        - readonly
    ReleasePolicyDto:
      type: object
      properties:
        id:
          type: string
          description: Policy rule ID
        name:
          type: string
          description: Policy name
        description:
          type: string
          description: Policy description
        type:
          type: string
          description: Policy type
          enum:
            - policy
            - restriction
        association:
          description: Policy associations (releases, device types, OS types, devices)
          allOf:
            - $ref: '#/components/schemas/PolicyAssociationDto'
        version:
          type: number
          description: Policy version number
        createdAt:
          type: string
          description: Policy creation timestamp
        updatedAt:
          type: string
          description: Policy last update timestamp
        isActive:
          type: boolean
          description: Whether the policy is active
        isPush:
          type: boolean
          description: Whether this policy should be pushed to agents
          default: false
        rule:
          type: object
          description: The policy rule definition conforming to rule engine schema
      required:
        - id
        - name
        - type
        - association
        - version
        - createdAt
        - updatedAt
        - isActive
        - rule
    DetailedReleaseDto:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        projectName:
          type: string
        projectId:
          type: number
        name:
          type: string
        releaseNotes:
          type: string
        metadata:
          description: >-
            Release metadata including autoDeploy and postInstallAction
            configuration. Additional user-defined properties are supported.
          allOf:
            - $ref: '#/components/schemas/ReleaseMetadata'
        status:
          type: string
          enum: *ref_39
          description: >-
            `draft`: Release is still being prepared.

            `in_review`: Submitted for review, not yet approved.

            `approved`: Approved but not yet released.

            `released`: Actively released and deployable.

            `archived`: No longer active.

            `error`: Release was previously released but one or more artifacts
            are missing from storage. Requires a user with
            `edit-released-release` permission to resolve.
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        requiredRegulationsCount:
          type: number
          description: Total number of required regulations
        compliantRegulationsCount:
          type: number
          description: Total number of compliant regulations
        latest:
          type: boolean
        releasedAt:
          format: date-time
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        isImported:
          type: boolean
          description: Indicates if this release was imported from another system
        readonly:
          type: boolean
          description: >-
            Indicates if this release is read-only. A release is read-only when
            its status is `released` or `error` and the current user does not
            have the `edit-released-release` permission.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseArtifactDto'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDto'
        policies:
          description: Policies associated with this release
          type: array
          items:
            $ref: '#/components/schemas/ReleasePolicyDto'
      required:
        - id
        - version
        - projectName
        - name
        - releaseNotes
        - metadata
        - status
        - createdAt
        - updatedAt
        - requiredRegulationsCount
        - compliantRegulationsCount
        - latest
        - isImported
        - readonly
    SetReleaseArtifactDto:
      type: object
      properties:
        artifactName:
          type: string
        type:
          type: string
          enum:
            - file
            - docker_image
          default: file
        isInstallationFile:
          type: boolean
        dockerImageUrl:
          type: string
        metadata:
          type: object
        isExecutable:
          type: boolean
          default: false
        arguments:
          type: string
        enableSbomScan:
          type: boolean
          description: >-
            Whether to trigger an SBOM scan for this artifact after upload.
            Defaults to true.
          default: true
      required:
        - artifactName
    SetReleaseArtifactResDto:
      type: object
      properties:
        artifactId:
          type: number
        uploadUrl:
          type: string
          description: Only present for FILE artifact type
      required:
        - artifactId
    UpdateFilePropertiesDto:
      type: object
      properties:
        arguments:
          type: string
        isExecutable:
          type: boolean
        isInstallationFile:
          type: boolean
        metadata:
          type: object
    RegulationSnapshotDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the regulation
        description:
          type: string
          description: Description of the regulation
        config:
          type: string
          description: Configuration of the regulation
        typeId:
          type: number
          description: Type Id of the regulation
      required:
        - name
        - typeId
    RegulationStatusDto:
      type: object
      properties:
        projectIdentifier:
          type: string
          description: Project identifier (ID or name)
        version:
          type: string
          description: Component Version of the regulation
        regulation:
          type: string
          description: Name of the regulation
        value:
          type: string
          description: Value of the regulation
        reportDetails:
          type: string
          description: Report Details of the regulation
        isCompliant:
          type: boolean
          description: Compliancy of the regulation
        createdAt:
          format: date-time
          type: string
          description: Creation date of the regulation status
        updatedAt:
          format: date-time
          type: string
          description: Update date of the regulation status
        regulationSnapshot:
          $ref: '#/components/schemas/RegulationSnapshotDto'
      required:
        - projectIdentifier
        - version
        - regulation
        - value
        - isCompliant
        - createdAt
        - updatedAt
    SetRegulationStatusDto:
      type: object
      properties:
        value:
          type: string
          description: Value of the regulation
        reportDetails:
          type: string
          description: Report Details of the regulation
      required:
        - value
    SetRegulationCompliancyDto:
      type: object
      properties:
        isCompliant:
          type: boolean
          description: Compliancy of the regulation
      required:
        - isCompliant
    ExportArtifactDto:
      type: object
      properties:
        name:
          type: string
          description: Artifact file name
        size:
          type: integer
          description: File size in bytes
          format: int64
        sha256:
          type: string
          description: SHA256 hash for integrity verification
        downloadUrl:
          type: string
          description: Download URL for the artifact
        metadata:
          type: object
          description: Additional metadata
      required:
        - name
        - size
        - sha256
        - downloadUrl
    ExportDockerImageDto:
      type: object
      properties:
        name:
          type: string
          description: Docker image name
        imageUrl:
          type: string
          description: Docker image URL
        metadata:
          type: object
          description: Additional metadata
      required:
        - name
        - imageUrl
    ExportDependencyDto:
      type: object
      properties:
        catalogId:
          type: string
          description: Dependency catalog ID
        name:
          type: string
          description: Dependency name
        version:
          type: string
          description: Dependency version
      required:
        - catalogId
        - name
        - version
